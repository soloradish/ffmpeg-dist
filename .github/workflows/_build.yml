name: Reusable build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  source:
    name: Verify source inputs
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Validate locks
        run: npm run validate:locks
      - name: Download and verify locked sources
        run: node scripts/fetch-sources.mjs --output source-archives
      - name: Create corresponding source bundle
        run: bash scripts/create-source-bundle.sh source-archives artifacts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-inputs
          path: source-archives/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sources
          path: artifacts/*-sources.tar.xz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  build:
    name: ${{ matrix.target }}
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x86_64
            runner: windows-2022
          - target: macos-aarch64
            runner: macos-15
          - target: macos-x86_64
            runner: macos-15-intel
          - target: linux-x86_64-musl
            runner: ubuntu-22.04
          - target: linux-aarch64-musl
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: source-inputs
          path: source-archives

      - name: Install Linux build tools
        if: startsWith(matrix.target, 'linux-')
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes autoconf automake bzip2 cmake file g++ libtool make musl-tools nasm ninja-build openssl pkg-config xz-utils

      - name: Install macOS build tools
        if: startsWith(matrix.target, 'macos-')
        shell: bash
        run: brew install automake cmake libtool nasm ninja pkg-config

      - name: Install Windows build tools
        if: startsWith(matrix.target, 'windows-')
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            autoconf automake base-devel bzip2 diffutils file gzip libtool make openssl patch pkgconf tar xz
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-toolchain

      - name: Build and verify Windows profiles
        if: startsWith(matrix.target, 'windows-')
        shell: msys2 {0}
        run: |
          bash scripts/build.sh "${{ matrix.target }}" core source-archives artifacts
          bash scripts/build.sh "${{ matrix.target }}" extended source-archives artifacts

      - name: Build and verify Unix profiles
        if: ${{ !startsWith(matrix.target, 'windows-') }}
        shell: bash
        run: |
          bash scripts/build.sh "${{ matrix.target }}" core source-archives artifacts
          bash scripts/build.sh "${{ matrix.target }}" extended source-archives artifacts

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload failed build diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostics-${{ matrix.target }}
          path: |
            .work/build-${{ matrix.target }}-*/package/**
            .work/build-${{ matrix.target }}-*/ffmpeg-configure-args.txt
            .work/build-${{ matrix.target }}-*/build/ffmpeg/config.log
            .work/verify-${{ matrix.target }}-*/**
            artifacts/*
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
          include-hidden-files: true

  gate:
    name: Build gate
    needs: [source, build]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Require every source and target job
        env:
          SOURCE_RESULT: ${{ needs.source.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          test "$SOURCE_RESULT" = success
          test "$BUILD_RESULT" = success
