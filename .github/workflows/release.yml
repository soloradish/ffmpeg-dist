name: Release

on:
  push:
    tags:
      - "v*-r*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - name: Fetch main and validate annotated tag
        run: |
          git fetch origin main
          node scripts/validate-release.mjs "$GITHUB_REF_NAME"
      - name: Reject an existing published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft' 2>/dev/null | grep -q false; then
            echo "A published release already exists for $GITHUB_REF_NAME."
            exit 1
          fi

  build:
    name: Rebuild release assets
    needs: validate
    uses: ./.github/workflows/_build.yml

  publish:
    name: Publish immutable release
    needs: [validate, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Generate and validate release metadata
        run: |
          mkdir -p .work
          node scripts/generate-manifest.mjs --directory release-assets --repository "$GITHUB_REPOSITORY"
          node scripts/generate-checksums.mjs release-assets
          node scripts/generate-release-notes.mjs .work/RELEASE_NOTES.md
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" = 13
      - name: Attest every release asset
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4
        with:
          subject-path: release-assets/*
      - name: Publish draft after all assets are ready
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-release.sh "$GITHUB_REF_NAME" release-assets .work/RELEASE_NOTES.md
